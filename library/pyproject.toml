[project]
name = "whitehats-library"
version = "0.1.0"
description = "Clone document schema and the node type library for Clone Studio."
requires-python = ">=3.12"
dependencies = [
    "detect-secrets>=1.5",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "library/schemas"
"types" = "library/types"
"guides" = "library/guides"
"data" = "library/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
