id: identity.entra
version: 1
family: identity
display_name: Microsoft Entra ID (staff)
aliases: [entra, azure ad, aad, staff sso, identity provider]
vendors: [Microsoft]
icon: identity.entra.svg
properties:
  - key: tenant_id
    tier: required
    type: string
  - key: conditional_access
    tier: recommended
    type: boolean
  - key: mfa_enforced
    tier: recommended
    type: boolean
  - key: privileged_role_count
    tier: derived
    type: number
  - key: credential
    tier: secret
    type: string
    scopes_hint: [AuditLog.Read.All, Directory.Read.All, Application.Read.All]
edges:
  allowed_out: [emits_telemetry_to, syncs_with, depends_on, contained_in]
  allowed_in: [authenticates_via, syncs_with, depends_on]
connection_test:
  kind: graph_api
  description: "Read /auditLogs/signIns?$top=1 through Microsoft Graph, expect 200"
whitehat_modes: [identity]
default_sense_points:
  - mode: identity
    reason: "Privileged role changes, credentials added to apps and risky sign-ins"
attack_techniques: [T1078.004, T1110.003, T1556.006, T1621, T1098.003, T1606.002, T1098.001]
importers: [graph_api]
deploy_guide_template: guides/identity.entra.md
