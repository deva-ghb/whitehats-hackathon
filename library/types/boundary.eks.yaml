id: boundary.eks
version: 1
family: boundaries
display_name: Amazon EKS cluster
aliases: [eks, kubernetes, k8s, aws kubernetes]
vendors: [Amazon Web Services]
icon: boundary.eks.svg
properties:
  - key: cluster_name
    tier: required
    type: string
  - key: region
    tier: required
    type: string
  - key: kubernetes_version
    tier: recommended
    type: string
  - key: endpoint_access
    tier: recommended
    type: enum
    values: [public, private, public_and_private]
  - key: audit_logging
    tier: recommended
    type: boolean
  - key: irsa_enabled
    tier: derived
    type: boolean
  - key: credential
    tier: secret
    type: string
    scopes_hint: ["eks:DescribeCluster", "eks:ListNodegroups", Kubernetes view ClusterRole]
edges:
  allowed_out: [runs_as, emits_telemetry_to, authenticates_via, depends_on, contained_in]
  allowed_in: [contained_in, runs_on, depends_on]
connection_test:
  kind: aws_api
  description: "Call eks:DescribeCluster, then list namespaces with the view role, expect 200"
whitehat_modes: [iac, identity, telemetry]
default_sense_points:
  - mode: identity
    reason: Who can reach the API server and which pods can assume which IAM roles
  - mode: telemetry
    reason: Kubernetes audit logs show exec into pods and role changes
attack_techniques: [T1610, T1609, T1613, T1552.007, T1098.006]
importers: [aws_config, kubernetes_api, terraform_aws_provider, helm]
deploy_guide_template: guides/boundary.eks.md
