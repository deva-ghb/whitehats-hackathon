id: delivery.acr
version: 1
family: code_and_delivery
display_name: Azure Container Registry
aliases: [acr, container registry, docker registry]
vendors: [Microsoft]
icon: delivery.acr.svg
properties:
  - key: registry_name
    tier: required
    type: string
  - key: admin_user_enabled
    tier: recommended
    type: boolean
  - key: public_network_access
    tier: recommended
    type: boolean
  - key: content_trust
    tier: recommended
    type: boolean
  - key: resource_id
    tier: derived
    type: string
  - key: credential
    tier: secret
    type: string
    scopes_hint: [AcrPull]
edges:
  allowed_out: [replicates_to, emits_telemetry_to, depends_on, contained_in]
  allowed_in: [pushes_image_to, reads, depends_on]
connection_test:
  kind: azure_api
  description: "List repositories with the AcrPull role, expect 200"
whitehat_modes: [supply_chain]
default_sense_points:
  - mode: supply_chain
    reason: "Every image that runs comes from here; the admin user is a shared password"
attack_techniques: [T1525, T1610, T1195.002]
importers: [azure_resource_graph, bicep, terraform_azurerm_provider]
deploy_guide_template: guides/delivery.acr.md
