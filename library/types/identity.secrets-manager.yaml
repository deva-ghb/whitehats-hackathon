id: identity.secrets-manager
version: 1
family: identity
display_name: AWS Secrets Manager
aliases: [secrets manager, secret store, aws secrets]
vendors: [Amazon Web Services]
icon: identity.secrets-manager.svg
properties:
  - key: region
    tier: required
    type: string
  - key: rotation_enabled
    tier: recommended
    type: boolean
  - key: kms_key
    tier: recommended
    type: string
  - key: secret_names
    tier: derived
    type: list
  - key: resource_policies
    tier: derived
    type: list
  - key: credential
    tier: secret
    type: string
    scopes_hint: ["secretsmanager:ListSecrets", "secretsmanager:DescribeSecret"]
edges:
  allowed_out: [emits_telemetry_to, replicates_to, backs_up_to, depends_on, contained_in]
  allowed_in: [stores_secret_in, reads, depends_on]
connection_test:
  kind: aws_api
  description: "Call secretsmanager:ListSecrets with the read-only role, expect 200; never read a secret value"
whitehat_modes: [identity, secrets]
default_sense_points:
  - mode: secrets
    reason: "Who reads which secret, and secrets that never rotate"
attack_techniques: [T1555.006, T1078.004]
importers: [aws_config, terraform_aws_provider]
deploy_guide_template: guides/identity.secrets-manager.md
