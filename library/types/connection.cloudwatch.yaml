id: connection.cloudwatch
version: 1
family: boundaries
display_name: CloudWatch logs connection
aliases: [cloudwatch connection, cloudwatch source]
vendors: [Amazon Web Services]
icon: connection.cloudwatch.svg
properties:
  - key: connector
    tier: required
    type: string
edges:
