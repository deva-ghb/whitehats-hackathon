id: identity.cognito
version: 1
family: identity
display_name: Amazon Cognito user pool
aliases: [cognito, user pool, customer login]
vendors: [Amazon Web Services]
icon: identity.cognito.svg
properties:
  - key: user_pool_id
    tier: required
    type: string
  - key: region
    tier: required
    type: string
  - key: mfa
    tier: recommended
    type: enum
    values: ["off", optional, "on"]
  - key: advanced_security
    tier: recommended
    type: boolean
  - key: self_sign_up
    tier: recommended
    type: boolean
  - key: app_clients
    tier: derived
    type: list
edges:
  allowed_out: [emits_telemetry_to, syncs_with, depends_on, contained_in]
  allowed_in: [authenticates_via, syncs_with, depends_on]
connection_test:
  kind: aws_api
  description: "Call cognito-idp:DescribeUserPool with the read-only role, expect 200"
whitehat_modes: [identity]
default_sense_points:
  - mode: identity
    reason: Credential stuffing and account takeover of customers
attack_techniques: [T1110.004, T1078.004, T1556.006, T1621]
importers: [aws_config, terraform_aws_provider]
deploy_guide_template: guides/identity.cognito.md
