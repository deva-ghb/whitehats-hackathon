id: data.cosmos
version: 1
family: data
display_name: Azure Cosmos DB
aliases: [cosmos, cosmos db, documentdb, nosql]
vendors: [Microsoft]
icon: data.cosmos.svg
properties:
  - key: account_name
    tier: required
    type: string
  - key: api
    tier: recommended
    type: enum
    values: [nosql, mongodb, cassandra, gremlin, table]
  - key: key_based_auth_disabled
    tier: recommended
    type: boolean
  - key: public_network_access
    tier: recommended
    type: boolean
  - key: backup_policy
    tier: recommended
    type: enum
    values: [periodic, continuous]
  - key: resource_id
    tier: derived
    type: string
edges:
  allowed_out: [publishes_to, replicates_to, backs_up_to, emits_telemetry_to, depends_on, contained_in]
  allowed_in: [reads, writes, replicates_to, backs_up_to, depends_on]
connection_test:
  kind: azure_api
  description: "Read the account with the Reader role, expect 200; never read documents"
whitehat_modes: [data, iac]
default_sense_points:
  - mode: data
    reason: Account keys give full read and write to every container
attack_techniques: [T1530, T1565.001, T1485, T1078.004]
importers: [azure_resource_graph, bicep, terraform_azurerm_provider]
deploy_guide_template: guides/data.cosmos.md
