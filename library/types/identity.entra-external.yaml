id: identity.entra-external
version: 1
family: identity
display_name: Microsoft Entra External ID (customers)
aliases: [b2c, azure ad b2c, external id, customer identity, ciam]
vendors: [Microsoft]
icon: identity.entra-external.svg
properties:
  - key: tenant_id
    tier: required
    type: string
  - key: mfa
    tier: recommended
    type: enum
    values: ["off", optional, "on"]
  - key: self_sign_up
    tier: recommended
    type: boolean
  - key: user_flows
    tier: derived
    type: list
  - key: credential
    tier: secret
    type: string
    scopes_hint: [AuditLog.Read.All]
edges:
  allowed_out: [emits_telemetry_to, syncs_with, depends_on, contained_in]
  allowed_in: [authenticates_via, syncs_with, depends_on]
connection_test:
  kind: graph_api
  description: "Read sign-in logs through Microsoft Graph in the external tenant, expect 200"
whitehat_modes: [identity]
default_sense_points:
  - mode: identity
    reason: Credential stuffing and account takeover of patients or customers
attack_techniques: [T1110.004, T1078.004, T1556.006, T1621]
importers: [graph_api]
deploy_guide_template: guides/identity.entra-external.md
